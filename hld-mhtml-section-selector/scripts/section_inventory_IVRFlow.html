<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section Inventory</title>
<style>
  :root {
    --ink: #16212e;
    --ink-soft: #4a5a6b;
    --line: #d9e0e7;
    --panel: #ffffff;
    --bg: #eef1f4;
    --accent: #2a5b8c;
    --accent-soft: #e4edf6;
    --ok: #2f7d4f;
    --ok-bg: #e5f3ea;
    --issue: #b4570a;
    --issue-bg: #fbead9;
    --empty: #8a94a0;
    --empty-bg: #eef0f2;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    padding: 28px 20px 90px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header.page-head {
    margin-bottom: 18px;
  }
  header.page-head h1 {
    font-size: 20px;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header.page-head .source {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    word-break: break-all;
  }

  .stat-bar {
    display: flex;
    gap: 10px;
    margin: 16px 0 18px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 14px;
    min-width: 108px;
  }
  .stat .num { font-size: 20px; font-weight: 650; }
  .stat .label { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .stat.issue .num { color: var(--issue); }
  .stat.ok .num { color: var(--ok); }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .toolbar input[type="search"] {
    flex: 1;
    min-width: 180px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13.5px;
    background: var(--panel);
  }
  .toolbar select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13.5px;
    background: var(--panel);
  }

  table.inv {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  table.inv thead th {
    position: sticky;
    top: 0;
    background: #f6f8fa;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 11.5px;
    font-weight: 650;
    color: var(--ink-soft);
    padding: 10px 12px;
    white-space: nowrap;
  }
  table.inv tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.inv tbody tr:last-child td { border-bottom: none; }
  table.inv tbody tr:hover { background: #fafbfc; }
  table.inv tbody tr.row-issue { background: var(--issue-bg); }
  table.inv tbody tr.row-issue:hover { background: #f7e0c4; }
  table.inv tbody tr.selected { outline: 2px solid var(--accent); outline-offset: -2px; }

  td.col-check { width: 34px; }
  td.col-id { width: 40px; font-family: var(--mono); color: var(--ink-soft); }
  td.col-num { width: 76px; font-family: var(--mono); color: var(--ink-soft); }
  td.col-status { width: 96px; }

  .heading-cell { display: flex; align-items: baseline; gap: 6px; }
  .heading-text { font-weight: 500; }
  .lvl-1 .heading-text { font-weight: 650; }
  .lvl-2 { padding-left: 14px; }
  .lvl-3 { padding-left: 28px; }
  .lvl-4 { padding-left: 42px; }
  .lvl-5 { padding-left: 56px; }
  .lvl-6 { padding-left: 70px; }

  .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .badge-table { background: var(--accent-soft); color: var(--accent); }
  .badge-diagram { background: #efe6f7; color: #6b3fa0; }
  .badge-image { background: #e7f4ee; color: #227a52; }
  .badge-text { background: var(--empty-bg); color: var(--ink-soft); }
  .badge-macro { background: #fdf3d8; color: #96700a; }
  .badge-issue { background: var(--issue-bg); color: var(--issue); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
  }
  .status-ok { background: var(--ok-bg); color: var(--ok); }
  .status-issue { background: var(--issue-bg); color: var(--issue); }
  .status-empty { background: var(--empty-bg); color: var(--empty); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .selection-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--ink);
    color: #fff;
    padding: 12px 20px;
    display: none;
    align-items: center;
    gap: 14px;
    font-size: 13.5px;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
  }
  .selection-bar.visible { display: flex; }
  .selection-bar .count { font-weight: 650; }
  .selection-bar button {
    margin-left: auto;
    background: #fff;
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
  }
  .selection-bar button:hover { background: #e9edf1; }
  .selection-bar .clear-btn {
    background: transparent;
    color: #cfd8e0;
    margin-left: 0;
    text-decoration: underline;
    padding: 8px 4px;
  }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  @media (max-width: 640px) {
    body { padding: 16px 10px 90px; }
    table.inv thead { display: none; }
    table.inv, table.inv tbody, table.inv tr, table.inv td { display: block; width: 100%; }
    table.inv tbody tr { border-bottom: 6px solid var(--bg); padding: 10px 4px; }
    table.inv tbody td { border-bottom: none; padding: 4px 8px; }
    td.col-check { display: inline-block; width: auto; }
    td.col-id { display: inline-block; width: auto; }
    .heading-cell { padding-left: 0 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <h1>Section Inventory</h1>
    <div class="source">https://reqcentral.com/wiki/spaces/FES/pages/757171938/IVR+Flows+MVP</div>
  </header>

  <div class="stat-bar" id="statBar"></div>

  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="Filter by heading text…">
    <select id="typeFilter">
      <option value="">All content types</option>
    </select>
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="ok">OK</option>
      <option value="issue">Possible issue</option>
      <option value="empty">Empty</option>
    </select>
  </div>

  <table class="inv" id="invTable">
    <thead>
      <tr>
        <th class="col-check"><input type="checkbox" id="selectAll"></th>
        <th class="col-id">#</th>
        <th class="col-num">No.</th>
        <th>Section Heading</th>
        <th>Content Type(s)</th>
        <th class="col-status">Status</th>
      </tr>
    </thead>
    <tbody id="invBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none;">No sections match the current filter.</div>
</div>

<div class="selection-bar" id="selectionBar">
  <span class="count"><span id="selCount">0</span> selected</span>
  <button class="clear-btn" id="clearSelBtn">Clear</button>
  <button id="copySelBtn">Copy selected headings</button>
</div>

<script>
const DATA = [{"id": 1, "level": 1, "heading": "Language Selection\nLanguage Selection\nPre Menu\nPreMenu Challenger\nAccount Status\nAccount LookUp\nActivate Card - Pre Menu\nAccount Summary Info\nMain Menu\nActivate Card - Main Menu\nTransactions\nCredit Limit\nRewards\nLost n Stolen\nDOB Module\nPIN Validation\nSet PIN Module\nChange PIN Flow\nPhone Number Module\nLegends\nRules\nSelf-Service\nFraud ANI\nChange Existing PIN Module\nStep Up Module\nAuthentication\nPre Menu Corporate\nMain Menu Corporate\nService\nDirect Transfer\nPost Call Survey\nIn-Queue Callback\nPre-Queue Callback\nVoiceMail\nQueue Config\nCNX_DID-Collect_Flow\nVIP OOP Call Flow\nPre Menu SMB\nMain Menu SMB\nSelectQueue Module\nCustomer Queue", "numbering": null, "types": ["macro:toc", "text", "diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 2, "level": 1, "heading": "Language Selection", "numbering": null, "types": [], "placeholderCount": 0, "status": "empty"}, {"id": 3, "level": 1, "heading": "Start\nQuebec\nElse\narea\ncode\nMerci d'avoir appel\u00e9 la Banque Rogers.\nFor English, please, press 1.\nThank you for calling Rogers Bank. pour passer en francais, appuyez sur1\u00a0\nInput\nInput\nNo input\nPress 1\nLANGUAGE\u00a0\nSELECTION\nPress 1\nNo Input\nUse french\nUse English\nHas Advisory\nNo\nPlay Advisory\nYes\nGet Params\nHas Advisory Disc\nEnd call\nYes\nResult\nNo\nFraud Q/CSR\nYes\nPre Menu\nFraud ANI check\nQuebec Area Codes:\n263, 354, 367, 418, 438, 450,\u00a0\n468, 514, 579, 581, 819 and 873.", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 4, "level": 1, "heading": "Pre Menu", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 5, "level": 1, "heading": "PreMenu Challenger", "numbering": null, "types": ["text", "diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 6, "level": 1, "heading": "PreMenu Challenger", "numbering": null, "types": ["table", "image", "diagram"], "placeholderCount": 0, "status": "ok"}, {"id": 7, "level": 1, "heading": "Account Status", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 8, "level": 1, "heading": "Account LookUp", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 9, "level": 1, "heading": "Activate Card - Pre Menu", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 10, "level": 1, "heading": "Account Summary Info", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 11, "level": 1, "heading": "Main Menu", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 12, "level": 1, "heading": "Activate Card - Main Menu", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 13, "level": 1, "heading": "Transactions", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 14, "level": 1, "heading": "Credit Limit", "numbering": null, "types": ["diagram", "image", "table", "text"], "placeholderCount": 0, "status": "ok"}, {"id": 15, "level": 1, "heading": "Rewards", "numbering": null, "types": ["diagram", "image", "text"], "placeholderCount": 0, "status": "ok"}, {"id": 16, "level": 1, "heading": "Lost n Stolen", "numbering": null, "types": ["text", "diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 17, "level": 1, "heading": "DOB Module", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 18, "level": 1, "heading": "PIN Validation", "numbering": null, "types": ["diagram", "image", "text"], "placeholderCount": 0, "status": "ok"}, {"id": 19, "level": 1, "heading": "Set PIN Module", "numbering": null, "types": ["diagram", "image", "text"], "placeholderCount": 0, "status": "ok"}, {"id": 20, "level": 1, "heading": "Change PIN Flow", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 21, "level": 1, "heading": "Phone Number Module", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 22, "level": 1, "heading": "Legends", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 23, "level": 1, "heading": "Rules", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 24, "level": 1, "heading": "Self-Service", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 25, "level": 1, "heading": "Fraud ANI", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 26, "level": 1, "heading": "Change Existing PIN Module", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 27, "level": 1, "heading": "Step Up Module", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 28, "level": 1, "heading": "Authentication", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 29, "level": 1, "heading": "Pre Menu Corporate", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 30, "level": 1, "heading": "Main Menu Corporate", "numbering": null, "types": ["diagram", "image", "text"], "placeholderCount": 0, "status": "ok"}, {"id": 31, "level": 1, "heading": "Service", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 32, "level": 1, "heading": "Direct Transfer", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 33, "level": 1, "heading": "Post Call Survey", "numbering": null, "types": ["diagram", "image", "text"], "placeholderCount": 0, "status": "ok"}, {"id": 34, "level": 1, "heading": "In-Queue Callback", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 35, "level": 1, "heading": "Pre-Queue Callback", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 36, "level": 1, "heading": "VoiceMail", "numbering": null, "types": ["diagram", "image", "text"], "placeholderCount": 0, "status": "ok"}, {"id": 37, "level": 1, "heading": "Queue Config", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 38, "level": 1, "heading": "CNX_DID-Collect_Flow", "numbering": null, "types": ["diagram", "image", "text", "table"], "placeholderCount": 0, "status": "ok"}, {"id": 39, "level": 1, "heading": "VIP OOP Call Flow", "numbering": null, "types": ["diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 40, "level": 1, "heading": "Pre Menu SMB", "numbering": null, "types": ["text", "diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 41, "level": 1, "heading": "Main Menu SMB", "numbering": null, "types": ["text", "diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 42, "level": 1, "heading": "SelectQueue Module", "numbering": null, "types": ["text", "diagram", "image"], "placeholderCount": 0, "status": "ok"}, {"id": 43, "level": 1, "heading": "Customer Queue", "numbering": null, "types": ["text", "diagram", "image"], "placeholderCount": 0, "status": "ok"}];
const TYPE_LABELS = {"table": "Table", "image": "Image", "diagram": "Diagram", "diagram-iframe": "Diagram (iframe)", "text": "Text", "unresolved-macro": "Unresolved macro"};

const selected = new Set();

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function badgeClass(t) {
  if (t === 'table') return 'badge-table';
  if (t === 'diagram' || t === 'diagram-iframe') return 'badge-diagram';
  if (t === 'image') return 'badge-image';
  if (t === 'unresolved-macro') return 'badge-issue';
  if (t.startsWith('macro:')) return 'badge-macro';
  return 'badge-text';
}

function typeLabel(t) {
  return TYPE_LABELS[t] || (t.startsWith('macro:') ? t.slice(6) : t);
}

function renderStats() {
  const total = DATA.length;
  const withTable = DATA.filter(r => r.types.includes('table')).length;
  const withDiagram = DATA.filter(r => r.types.includes('diagram') || r.types.includes('diagram-iframe')).length;
  const issues = DATA.filter(r => r.status === 'issue').length;
  const stats = [
    { label: 'Total sections', value: total, cls: '' },
    { label: 'With tables', value: withTable, cls: '' },
    { label: 'With diagrams', value: withDiagram, cls: '' },
    { label: 'Possible issues', value: issues, cls: issues ? 'issue' : 'ok' },
  ];
  document.getElementById('statBar').innerHTML = stats.map(s =>
    `<div class="stat ${s.cls}"><div class="num">${s.value}</div><div class="label">${s.label}</div></div>`
  ).join('');
}

function populateTypeFilter() {
  const allTypes = new Set();
  DATA.forEach(r => r.types.forEach(t => allTypes.add(t)));
  const sel = document.getElementById('typeFilter');
  Array.from(allTypes).sort().forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = typeLabel(t);
    sel.appendChild(opt);
  });
}

function statusPill(status) {
  const map = {
    ok: ['status-ok', 'OK'],
    issue: ['status-issue', 'Check'],
    empty: ['status-empty', 'Empty'],
  };
  const [cls, label] = map[status] || map.ok;
  return `<span class="status-pill ${cls}"><span class="status-dot"></span>${label}</span>`;
}

function currentFilters() {
  return {
    q: document.getElementById('searchBox').value.trim().toLowerCase(),
    type: document.getElementById('typeFilter').value,
    status: document.getElementById('statusFilter').value,
  };
}

function renderRows() {
  const { q, type, status } = currentFilters();
  const tbody = document.getElementById('invBody');
  const filtered = DATA.filter(r => {
    if (q && !r.heading.toLowerCase().includes(q)) return false;
    if (type && !r.types.includes(type)) return false;
    if (status && r.status !== status) return false;
    return true;
  });

  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';

  tbody.innerHTML = filtered.map(r => {
    const badges = r.types.length
      ? r.types.map(t => `<span class="badge ${badgeClass(t)}">${escapeHtml(typeLabel(t))}</span>`).join('')
      : `<span class="badge badge-text">None detected</span>`;
    const rowClass = r.status === 'issue' ? 'row-issue' : '';
    const isSel = selected.has(r.id) ? 'selected' : '';
    return `<tr class="${rowClass} ${isSel}" data-id="${r.id}">
      <td class="col-check"><input type="checkbox" class="rowCheck" data-id="${r.id}" ${selected.has(r.id) ? 'checked' : ''}></td>
      <td class="col-id">${r.id}</td>
      <td class="col-num">${escapeHtml(r.numbering || '—')}</td>
      <td class="heading-cell lvl-${r.level}"><span class="heading-text">${escapeHtml(r.heading)}</span></td>
      <td><div class="badges">${badges}</div></td>
      <td class="col-status">${statusPill(r.status)}</td>
    </tr>`;
  }).join('');

  document.querySelectorAll('.rowCheck').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const id = parseInt(e.target.getAttribute('data-id'), 10);
      if (e.target.checked) selected.add(id); else selected.delete(id);
      e.target.closest('tr').classList.toggle('selected', e.target.checked);
      renderSelectionBar();
    });
  });
}

function renderSelectionBar() {
  const bar = document.getElementById('selectionBar');
  const count = selected.size;
  document.getElementById('selCount').textContent = count;
  bar.classList.toggle('visible', count > 0);
}

document.getElementById('selectAll').addEventListener('change', (e) => {
  const { q, type, status } = currentFilters();
  const visibleIds = DATA.filter(r => {
    if (q && !r.heading.toLowerCase().includes(q)) return false;
    if (type && !r.types.includes(type)) return false;
    if (status && r.status !== status) return false;
    return true;
  }).map(r => r.id);
  if (e.target.checked) visibleIds.forEach(id => selected.add(id));
  else visibleIds.forEach(id => selected.delete(id));
  renderRows();
  renderSelectionBar();
});

document.getElementById('clearSelBtn').addEventListener('click', () => {
  selected.clear();
  renderRows();
  renderSelectionBar();
});

document.getElementById('copySelBtn').addEventListener('click', () => {
  const chosen = DATA.filter(r => selected.has(r.id));
  const text = chosen.map(r => `${r.numbering ? r.numbering + ' ' : ''}${r.heading}`).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copySelBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  });
});

document.getElementById('searchBox').addEventListener('input', renderRows);
document.getElementById('typeFilter').addEventListener('change', renderRows);
document.getElementById('statusFilter').addEventListener('change', renderRows);

renderStats();
populateTypeFilter();
renderRows();
renderSelectionBar();
</script>
</body>
</html>
